<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Magick 8-Ball</title>
  <style>
    :root {
      --bg-color: #060913;
      --card-bg: #0f172a;
      --accent: #38bdf8;
      --accent-glow: #818cf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --error-color: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .ball-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 24px auto;
    }

    .eight-ball {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2a334d, #000 85%);
      box-shadow: inset -10px -10px 25px rgba(0,0,0,0.9), 0 10px 30px rgba(56, 189, 248, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .eight-ball.shaking {
      animation: shake 0.8s ease-in-out infinite;
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-6px, 6px) rotate(-5deg); }
      40% { transform: translate(6px, -6px) rotate(5deg); }
      60% { transform: translate(-6px, -6px) rotate(-3deg); }
      80% { transform: translate(6px, 6px) rotate(3deg); }
    }

    .window {
      width: 105px;
      height: 105px;
      background: #030712;
      border: 3px solid #1e293b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.95);
      position: relative;
      overflow: hidden;
    }

    .die-triangle {
      width: 0;
      height: 0;
      border-left: 42px solid transparent;
      border-right: 42px solid transparent;
      border-bottom: 75px solid #1e1b4b;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.4);
      transition: all 0.8s ease-out;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
    }

    .die-triangle.active {
      opacity: 1;
      transform: scale(1);
    }

    .answer-text {
      position: absolute;
      top: 42px;
      left: -32px;
      width: 64px;
      color: var(--accent);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.1;
      user-select: none;
    }

    .initial-8 {
      font-size: 3.8rem;
      font-weight: 800;
      color: #ffffff;
      transition: opacity 0.3s ease;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #020617;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    .status-bar {
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--text-sub);
      min-height: 18px;
    }

    .status-bar.error {
      color: var(--error-color);
    }

    .drand-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.7rem;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Quantum Magick 8-Ball</h1>
    <p class="subtitle">qrandom.io via Val.town Proxy</p>

    <div class="ball-container">
      <div class="eight-ball" id="eightBall">
        <div class="window">
          <span class="initial-8" id="initialEight">8</span>
          <div class="die-triangle" id="dieTriangle">
            <span class="answer-text" id="answerText"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="input-group">
      <input type="text" id="questionInput" placeholder="Ask a yes/no question..." />
      <button id="askBtn">Consult Quantum Realm</button>
    </div>

    <div class="status-bar" id="statusBar">Awaiting your question...</div>
    <div class="drand-badge" id="drandBadge">Proxy: Selapian Val</div>
  </div>

  <script>
    const PROXY_URL = "https://Selapian--2f58e6388fb311f1b0781607ee4eb77e.web.val.run?count=1";

    const ANSWERS = [
      "It is certain", "Decidedly so", "Without a doubt", "Yes definitely",
      "You may rely on it", "As I see it, yes", "Most likely", "Outlook good",
      "Yes", "Signs point to yes", "Reply hazy, try again", "Ask again later",
      "Better not tell you now", "Cannot predict now", "Concentrate and ask again",
      "Don't count on it", "My reply is no", "My sources say no",
      "Outlook not so good", "Very doubtful"
    ];

    async function fetchQuantumIndex() {
      const response = await fetch(PROXY_URL);
      if (!response.ok) {
        throw new Error(`Proxy HTTP error ${response.status}`);
      }

      const data = await response.json();
      
      // Explicitly extract from data.number array
      if (data){
        const rawByte = Number(data.number);
        const index = rawByte % ANSWERS.length;
        return { index, rawByte };
      }
      
      throw new Error("Invalid payload: missing data.number array");
    }

    async function askQuantum8Ball() {
      const questionInput = document.getElementById("questionInput");
      const askBtn = document.getElementById("askBtn");
      const eightBall = document.getElementById("eightBall");
      const initialEight = document.getElementById("initialEight");
      const dieTriangle = document.getElementById("dieTriangle");
      const answerText = document.getElementById("answerText");
      const statusBar = document.getElementById("statusBar");
      const drandBadge = document.getElementById("drandBadge");

      const question = questionInput.value.trim();
      if (!question) {
        statusBar.className = "status-bar error";
        statusBar.textContent = "Please ask a question first!";
        return;
      }

      askBtn.disabled = true;
      eightBall.classList.add("shaking");
      initialEight.style.opacity = "0";
      dieTriangle.classList.remove("active");
      statusBar.className = "status-bar";
      statusBar.textContent = "Collapsing quantum wave via Val.town proxy...";

      try {
        const { index, rawByte } = await fetchQuantumIndex();
        const answer = ANSWERS[index];

        setTimeout(() => {
          eightBall.classList.remove("shaking");
          answerText.textContent = answer;
          dieTriangle.classList.add("active");
          statusBar.textContent = "Quantum state observed!";
          drandBadge.textContent = `Raw Byte: ${rawByte} | Index: ${index}`;
          askBtn.disabled = false;
        }, 500);

      } catch (err) {
        console.error("Quantum fetch failed:", err);
        
        setTimeout(() => {
          eightBall.classList.remove("shaking");
          initialEight.style.opacity = "1";
          statusBar.className = "status-bar error";
          statusBar.textContent = `Error: ${err.message}`;
          drandBadge.textContent = "Fetch Failed";
          askBtn.disabled = false;
        }, 500);
      }
    }

    document.getElementById("askBtn").addEventListener("click", askQuantum8Ball);
    document.getElementById("questionInput").addEventListener("keypress", (e) => {
      if (e.key === 'Enter') askQuantum8Ball();
    });
  </script>
</body>
</html>
